<h1>4. Academic Planner Page</h1>
<p>Interactive planner - Add, Mark as completed, Delete tasks (JavaScript)</p>

<div id="planner-container">
<input type="text" id="taskInput" placeholder="Enter task e.g., Study COS106">
<button onclick="addTask()" style="background:#3498db;color:white;padding:10px 15px;border:none;border-radius:5px;">Add Task</button>
<ul id="taskList"></ul>
</div>

<script>
function addTask(){
let input = document.getElementById("taskInput");
let taskText = input.value.trim();
if(taskText === ""){ alert("Please enter a task!"); return; }

let li = document.createElement("li");
li.innerHTML = `<span onclick="toggleTask(this)">${taskText}</span> <div><button class="task-btn done-btn" onclick="toggleTask(this.parentNode.previousElementSibling)">Done</button> <button class="task-btn del-btn" onclick="deleteTask(this)">Delete</button></div>`;

document.getElementById("taskList").appendChild(li);
input.value = "";
}

function toggleTask(span){
span.classList.toggle("completed");
}

function deleteTask(btn){
btn.parentNode.parentNode.remove();
}
</script>

</body>
